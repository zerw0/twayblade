[workspace]
members = ["crates/core", "crates/desktop", "crates/platform"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
iced = { version = "0.14", features = ["tokio", "svg"] }
matrix-sdk = { version = "=0.19.1", features = ["bundled-sqlite"] }
matrix-sdk-ui = "=0.19.1"
async-stream = "0.3"
futures-util = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "time", "rt-multi-thread", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
url = "2"
chrono = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1

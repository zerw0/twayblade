[package]
name = "twayblade-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
mime = "=0.3.17"
mime_guess = "=2.0.5"
imbl = "=7.0.2"
matrix-sdk = { workspace = true, features = ["markdown", "experimental-send-custom-to-device"] }
matrix-sdk-ui.workspace = true
ruma-html = "=0.9.0"
tracing = "0.1"
async-stream.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
uuid.workspace = true
zeroize.workspace = true
twayblade-platform = { path = "../platform" }

base64 = "=0.22.1"
getrandom = "=0.4.3"
twayblade-media = { path = "../media" }

[dev-dependencies]
twayblade-media = { path = "../media", features = ["evidence"] }
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true

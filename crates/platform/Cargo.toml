[package]
name = "twayblade-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
directories.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
thiserror.workspace = true
zeroize.workspace = true
futures-util.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
semver = "=1.0.28"
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
mac-usernotifications = "=0.3.1"
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSError", "NSNotification", "NSOperation", "NSString", "block2"] }
objc2-user-notifications = { version = "=0.3.2", features = ["UNUserNotificationCenter", "block2"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSColor", "NSColorSpace", "NSWorkspace", "NSAccessibility", "NSSound", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "UI_ViewManagement", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
# async-io, not tokio: GPUI's Linux backend enables ashpd/async-io, and ashpd
# refuses both. Its futures run on any executor, including our tokio runtime.
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "settings"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }

# Native observer registration and Win32 output pointers are isolated in audited
# platform modules. Core/frontend retain the workspace-wide forbid policy.
[lints.rust]
unsafe_code = "deny"

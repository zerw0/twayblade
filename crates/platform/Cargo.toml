[package]
name = "matrix-client-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true
thiserror.workspace = true
zeroize.workspace = true
futures-util.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
mac-usernotifications = "=0.3.1"
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError"] }
objc2-user-notifications = { version = "=0.3.2", features = ["UNUserNotificationCenter", "block2"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSColor", "NSColorSpace", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
windows = { version = "=0.62.2", features = ["UI_ViewManagement", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "settings"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[lints]
workspace = true

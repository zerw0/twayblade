[package]
name = "twayblade-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Test/fixture evidence only: counts decoded audio/video frames. Never in
# release builds; it adds a sink per remote track.
evidence = []

[dependencies]
getrandom = "=0.4.3"
livekit = { version = "=0.10.1", features = ["rustls-tls-native-roots"] }
tokio.workspace = true
futures-util.workspace = true
thiserror.workspace = true

livekit-net = { version = "=0.1.4", features = ["native"] }
reqwest = { version = "=0.13.5", default-features = false }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
async-trait = "=0.1.92"
url.workspace = true

# Screen sharing through xdg-desktop-portal needs a GLib main loop on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
livekit = { version = "=0.10.1", features = ["rustls-tls-native-roots", "glib-main-loop"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Graphics_Capture", "Win32_System_WinRT"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSDictionary", "NSValue", "NSString"] }
objc2-av-foundation = { version = "=0.3.2", features = ["dispatch2", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = "=0.3.2"
objc2-core-video = "=0.3.2"
dispatch2 = "=0.3.1"

[lints.rust]
unsafe_code = "deny"

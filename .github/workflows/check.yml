name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config cmake libdbus-1-dev libwayland-dev libxkbcommon-dev
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
          libfontconfig1-dev libfreetype6-dev libssl-dev libxcb1-dev libxkbfile-dev
          libxkbcommon-x11-dev libvulkan-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Build native desktop
        run: cargo build --locked -p matrix-client-gpui

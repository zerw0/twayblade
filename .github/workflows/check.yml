name: Rust checks
# Branch flow: feature/* -> develop -> main. Feature branches and develop are
# tested only (format, lint, tests); no app build here. Binaries are built only
# from main and release tags, by build.yml.
# Pushes run only on main and develop (after a merge); a feature branch is
# checked once, by its pull request, not again by its push.
# Documentation-only changes (Markdown, docs/, licences) skip the Rust steps.
# Pushes simply don't start. Pull requests always start, because main requires
# the three `check (...)` results: for a documentation-only pull request the
# `changes` job says so, and each check job skips its steps and passes in
# seconds, so auto-merge works without an admin.
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch cancels that branch's older run, so superseded runs
# don't queue up on the (scarce) macOS runners. The event name is part of the
# group: the push run and the pull-request run of a branch still both run.
# A release/* pull request at develop's tip waits for develop's push run of
# the same commit instead of repeating its tests (see `changes`).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  # Never cancel runs on main or develop: a failure on an intermediate commit
  # must stay visible.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    # Long enough to wait for develop's run (see `reuse` below).
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      tested: ${{ steps.reuse.outputs.tested }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$PR" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything outside Markdown, docs/ and licences needs the Rust checks.
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename' \
              | grep -qvE '(\.md$|^docs/|^LICENSE)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      # A release/* branch cut at develop's tip has the same commit as
      # develop's push run, which already formats, lints and tests it. Wait for
      # that run instead of repeating it on every OS: its success counts here,
      # its failure fails this run. Only the app build (main-only) still runs.
      - id: reuse
        if: startsWith(github.head_ref, 'release/') && steps.files.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/runs?event=push&branch=develop&head_sha=${SHA}" \
            --jq '.workflow_runs | map(select(.conclusion != "cancelled")) | first | .id // empty')"
          if [[ -z "$run" ]]; then
            echo "No develop run for ${SHA}; testing here."
            exit 0
          fi
          echo "Waiting for develop's run ${run} on the same commit."
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --interval 60 --exit-status > /dev/null
          echo "tested=true" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CODE: ${{ needs.changes.outputs.code }}
      # Already formatted, linted and tested by develop's run of this commit.
      TESTED: ${{ needs.changes.outputs.tested == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: env.CODE == 'true'
      - name: Install Linux build dependencies
        if: env.CODE == 'true' && runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config cmake libdbus-1-dev libwayland-dev libxkbcommon-dev
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
          libfontconfig1-dev libfreetype6-dev libssl-dev libxcb1-dev libxkbfile-dev
          libxkbcommon-x11-dev libvulkan-dev libglib2.0-dev libpulse-dev
      # libwebrtc's bundled libc++ needs clang 21+; Ubuntu 24.04 ships 18.
      - name: Install clang 21
        if: env.CODE == 'true' && runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update && sudo apt-get install -y clang-21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - name: Install Rust
        if: env.CODE == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - name: Tested by develop
        if: env.TESTED == 'true'
        run: echo "Formatted, linted and tested by develop's run of this commit."
      - name: Format
        if: env.CODE == 'true' && env.TESTED != 'true'
        run: cargo fmt --all -- --check
      - name: Lint
        if: env.CODE == 'true' && env.TESTED != 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        if: env.CODE == 'true' && env.TESTED != 'true'
        # GPUI test windows build deep element trees; in debug builds that
        # overflowed the default 2 MiB test-thread stack on Windows.
        env:
          RUST_MIN_STACK: '8388608'
        run: cargo test --locked --workspace --all-features
      - name: Release script tests
        if: env.CODE == 'true' && env.TESTED != 'true' && runner.os == 'Linux'
        run: |
          python3 scripts/test_release_notes.py
          python3 scripts/test_homebrew_cask.py
      # The app binary itself only on main (and pull requests into it);
      # develop and feature branches stop at the tests.
      - name: Build native desktop
        if: >-
          env.CODE == 'true' && (github.ref == 'refs/heads/main'
          || github.base_ref == 'main')
        run: cargo build --locked -p twayblade
      - name: Documentation only
        if: env.CODE != 'true'
        run: echo "Documentation-only change; Rust checks skipped."

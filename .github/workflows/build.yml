name: Build binaries
# Release binaries for macOS, Linux and Windows. Every push to main and every
# manual run uploads them as workflow artifacts; a `v*` tag also publishes a
# GitHub release with the same files. Builds are unsigned (macOS ad hoc).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config cmake libdbus-1-dev libwayland-dev libxkbcommon-dev
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
          libfontconfig1-dev libfreetype6-dev libssl-dev libxcb1-dev libxkbfile-dev
          libxkbcommon-x11-dev libvulkan-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: |
          bash macos/build.sh --release
          mkdir -p dist
          # ditto keeps the bundle's symlinks, metadata and signature intact.
          ditto -c -k --keepParent "target/release/bundle/Twayblade.app" "dist/twayblade-${{ matrix.name }}.zip"

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release -p twayblade
          mkdir -p dist/twayblade
          cp target/release/twayblade README.md dist/twayblade/
          tar -C dist -czf "dist/twayblade-${{ matrix.name }}.tar.gz" twayblade

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release -p twayblade
          New-Item -ItemType Directory -Force dist/twayblade | Out-Null
          Copy-Item target/release/twayblade.exe, README.md dist/twayblade/
          Compress-Archive -Path dist/twayblade -DestinationPath "dist/twayblade-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: twayblade-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

name: Build binaries
# Release binaries for macOS, Linux and Windows. Every push to main and every
# manual run uploads them as workflow artifacts; a `v*` tag also creates a
# draft GitHub pre-release with the same files, checksums and drafted notes.
# Nothing becomes public until a person reviews and publishes the draft.
# Builds are unsigned (macOS ad hoc).
on:
  push:
    branches: [main]
    # Documentation-only pushes to main don't need new binaries (tags always build).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config cmake libdbus-1-dev libwayland-dev libxkbcommon-dev
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
          libfontconfig1-dev libfreetype6-dev libssl-dev libxcb1-dev libxkbfile-dev
          libxkbcommon-x11-dev libvulkan-dev libglib2.0-dev libpulse-dev
          desktop-file-utils appstream
      # libwebrtc's bundled libc++ needs clang 21+; Ubuntu 24.04 ships 18.
      - name: Install clang 21
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update && sudo apt-get install -y clang-21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: |
          bash macos/build.sh --release
          mkdir -p dist
          # ditto keeps the bundle's symlinks, metadata and signature intact.
          ditto -c -k --keepParent "target/release/bundle/Twayblade.app" "dist/twayblade-${{ matrix.name }}.zip"
          # The disk image for direct downloads and the Homebrew cask (#52).
          bash macos/make-dmg.sh target/release/bundle/Twayblade.app

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release -p twayblade
          strip target/release/twayblade
          mkdir -p dist/twayblade
          # The tarball also feeds the AUR package (packaging/aur/PKGBUILD).
          cp target/release/twayblade README.md LICENSE \
            packaging/linux/com.twayblade.desktop.desktop \
            packaging/linux/com.twayblade.desktop.metainfo.xml \
            packaging/icons/com.twayblade.desktop.svg \
            packaging/icons/com.twayblade.desktop.png dist/twayblade/
          cp crates/media/licenses/libwebrtc-a545de4.md dist/twayblade/libwebrtc-LICENSE.md
          tar -C dist -czf "dist/twayblade-${{ matrix.name }}.tar.gz" twayblade
          rm -rf dist/twayblade

      # deb, rpm and AppImage from the same binary (#53). Unsigned.
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/linux/com.twayblade.desktop.desktop
          appstreamcli validate --no-net --explain packaging/linux/com.twayblade.desktop.metainfo.xml
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "twayblade"))')+git${GITHUB_SHA::7}"
          fi
          # Package managers order "0.1.0-rc.1" after "0.1.0"; "~" sorts before.
          pkgversion="${version//-/\~}"
          cargo deb -p twayblade --no-build --deb-version "$pkgversion" -o dist/
          cargo generate-rpm -p crates/app -s "version = \"$pkgversion\"" -o dist/
          bash packaging/linux/build-appimage.sh target/release/twayblade "$version" dist
          ls -l dist

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release -p twayblade
          New-Item -ItemType Directory -Force dist/twayblade | Out-Null
          Copy-Item target/release/twayblade.exe, README.md dist/twayblade/
          Copy-Item crates/media/licenses/libwebrtc-a545de4.md dist/twayblade/libwebrtc-LICENSE.md
          Compress-Archive -Path dist/twayblade -DestinationPath "dist/twayblade-${{ matrix.name }}.zip"
          Remove-Item -Recurse dist/twayblade

      # MSI installer (#54) with WiX 5 (v6+ needs a maintenance-fee EULA
      # decision). Unsigned: signing needs the release certificate.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
              Where-Object name -eq 'twayblade' | Select-Object -ExpandProperty version
          }
          # MSI versions are numeric (major.minor.patch); "-rc.1" is dropped.
          $msiVersion = ($version -split '[-+]')[0]
          wix build packaging/windows/twayblade.wxs -arch x64 `
            -d "Version=$msiVersion" -d "BinDir=target\release" -d "Root=$PWD" `
            -o "dist/Twayblade-$version-x86_64.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: twayblade-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*.msi
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      # Notes from the pull requests merged since the previous tag (or since
      # the first commit), grouped as New, Improved and Fixed with stated gaps.
      - name: Draft release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null \
            || git log --max-parents=0 --format=%cs HEAD | tail -n 1)"
          python3 scripts/release-notes.py --version "${GITHUB_REF_NAME#v}" \
            --since "$previous" --gh gh > notes.md
      # Always a draft pre-release: a person rewords the notes and publishes
      # it, and stable is a separate, explicit promotion (#55).
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          draft: true
          prerelease: true
